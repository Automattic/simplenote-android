buildscript {
    repositories {
        google()
        maven { url 'https://maven.google.com' }
    }

}

plugins {
    id 'com.android.library'
}

android {
    namespace 'org.wordpress.passcodelock'
    compileSdk 36

    defaultConfig {
        minSdk 23
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

// This module has no instrumented tests. Its unused test APK also fails the duplicate class check,
// because it gets mixed Kotlin stdlib versions from transitive dependencies.
androidComponents {
    beforeVariants(selector().all()) { variantBuilder ->
        variantBuilder.androidTest.enable = false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.preference:preference:1.2.1'
}

android.buildTypes.all { buildType ->
    project.properties.any { property ->
        if (property.key.toLowerCase().startsWith("passcodelock.")) {
            buildType.buildConfigField "String", property.key.replace("passcodelock.", "").replace(".", "_").toUpperCase(), "\"${property.value}\""
        }
    }
}
