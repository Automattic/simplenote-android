include ':Simplenote', ':Wear'
include ':PasscodeLock'

gradle.ext {
    a8cSecretsDir = resolveA8cSecretsDir(file("${rootDir}/.a8c-secrets/repo-id"))
    def secretsFile = new File(a8cSecretsDir, "secrets.properties")
    if (!secretsFile.exists()) {
        logger.warn(
            "${secretsFile} not found, so this build uses placeholder values and logging in will fail. " +
                "Run `a8c-secrets decrypt` to apply secrets."
        )
    }
    secretProperties = loadPropertiesFromFile(
            secretsFile.exists() ? secretsFile : file("${rootDir}/Simplenote/secrets.properties-example")
    )
}

// Mirrors `a8c-secrets which`, without spawning the command
static def resolveA8cSecretsDir(File repoIdFile) {
    new File("${System.getProperty("user.home")}/.a8c-secrets/${repoIdFile.text.trim()}")
}

static def loadPropertiesFromFile(File inputFile) {
    def properties = new Properties()
    inputFile.withInputStream { stream ->
        properties.load(stream)
    }
    return properties
}
