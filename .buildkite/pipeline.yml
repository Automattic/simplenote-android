# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
---

agents:
  queue: android

steps:
  - label: ":gradle: Gradle Wrapper Validation"
    command: validate_gradle_wrapper
    agents:
      queue: linter
    notify:
      - github_commit_status:
          context: Gradle Wrapper Validation

  - wait

  - label: ":hammer_and_pick: Build and Test"
    command: ./gradlew --stacktrace testDebugUnitTest
    plugins: [$CI_TOOLKIT_PLUGIN]
    notify:
      - github_commit_status:
          context: Build and Test

  - label: ":danger: Danger - PR Check"
    command: danger
    key: danger
    if: "build.pull_request.id != null"
    retry:
      manual:
        permit_on_passed: true
    agents:
      queue: linter
    notify:
      - github_commit_status:
          context: Danger - PR Check

  - label: ":microscope: Lint"
    command: ./gradlew --stacktrace lintDebug
    plugins: [$CI_TOOLKIT_PLUGIN]
    notify:
      - github_commit_status:
          context: Lint

  # On demand, so that an agent doesn't build a prototype for every push to a PR.
  # The group keeps the input from blocking the steps that follow it.
  - group: ":hammer_and_pick: Prototype Build"
    steps:
      - input: "Deploy Prototype Build?"
        prompt: "Share a Prototype Build via Firebase App Distribution?"
        key: prototype_triggered
        if: "build.pull_request.id != null || build.pull_request.draft"
      - label: ":hammer_and_pick: Prototype Build"
        depends_on: prototype_triggered
        command: .buildkite/commands/build-prototype.sh
        plugins: [$CI_TOOLKIT_PLUGIN]
        if: "build.pull_request.id != null || build.pull_request.draft"
        notify:
          - github_commit_status:
              context: Prototype Build
